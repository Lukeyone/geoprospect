minimum_pre_commit_version: "4.6.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
        exclude: ^src/geoprospect/py\.typed$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args:
          - --maxkb=512
      - id: detect-private-key
      - id: mixed-line-ending
        args:
          - --fix=no

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - '(^|/)uv\.lock$'

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --force-exclude
        language: python
        additional_dependencies:
          - ruff==0.16.0
        types:
          - python

      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check --force-exclude
        language: python
        additional_dependencies:
          - ruff==0.16.0
        types:
          - python

      - id: mypy
        name: mypy strict typing
        entry: uv run --with mypy==2.1.0 mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --with pytest==9.0.2 pytest -q
        language: system
        pass_filenames: false
        always_run: true
