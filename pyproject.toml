[project]
name = "geoprospect"
version = "0.1.0"
description = "Reproducible Stage 0 feasibility-audit tooling for the GeoProspect project."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Lachlan McDonald" }]
dependencies = []

[project.scripts]
geoprospect = "geoprospect.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
