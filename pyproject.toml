[project]
name = "geoprospect"
version = "0.1.0"
description = "Reproducible Stage 0 feasibility-audit tooling for the GeoProspect project."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Lachlan McDonald" }]
dependencies = []

[project.scripts]
geoprospect = "geoprospect.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true
