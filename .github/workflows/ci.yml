name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Synchronise locked environment
        run: uv sync --locked

      - name: Check formatting
        run: uvx --from ruff==0.16.0 ruff format --check .

      - name: Run Ruff
        run: uvx --from ruff==0.16.0 ruff check .

      - name: Run mypy
        run: uvx --from mypy==2.1.0 mypy

      - name: Run pytest
        run: uv run --with pytest==9.0.2 pytest -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Synchronise locked environment
        run: uv sync --locked

      - name: Scan tracked files for secrets
        shell: bash
        run: |
          uvx --from detect-secrets==1.5.0 detect-secrets scan \
            --all-files \
            --disable-plugin HexHighEntropyString \
            --disable-plugin Base64HighEntropyString \
            --exclude-files '(^|/)uv\.lock$' \
            > /tmp/detect-secrets.json
          uv run python -m geoprospect.secret_scan /tmp/detect-secrets.json

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Run all pre-commit hooks
        run: uvx --from pre-commit==4.6.0 pre-commit run --all-files --show-diff-on-failure
